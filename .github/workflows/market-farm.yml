name: Market Farm

on:
  push:
    branches: [main]
    paths:
      - 'market_farm/news.py'
      - 'market_farm/news_quality.py'
      - 'market_farm/engine.py'
      - 'market_farm/ledger.py'
      - 'market_farm/dashboard.py'
      - 'market_farm/research_report.py'
      - 'market_farm/point_in_time.py'
      - 'config.json'
      - '.github/workflows/market-farm.yml'
  schedule:
    # UTC: 08:07 and 20:07 JST, Mon-Fri.
    - cron: '7 23 * * 0-4'
    - cron: '7 11 * * 1-5'
  workflow_dispatch:
    inputs:
      session:
        description: morning or evening
        required: true
        default: morning
        type: choice
        options:
          - morning
          - evening

permissions:
  contents: write

concurrency:
  group: market-farm-run
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Test sensors
        run: python -m pytest -q
      - name: Decide session
        id: session
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.session }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "7 23 * * 0-4" ]; then
            echo "value=morning" >> "$GITHUB_OUTPUT"
          else
            echo "value=evening" >> "$GITHUB_OUTPUT"
          fi
      - name: Run market farm
        run: python -m market_farm.cli "${{ steps.session.outputs.value }}"
      - name: Save results
        shell: bash
        run: |
          git config user.name "market-farm-bot"
          git config user.email "market-farm-bot@users.noreply.github.com"
          git add data/state.json data/cards data/cards_index.json data/research_report.json data/morning_brief.json docs/index.html docs/newspaper.html docs/research.html
          if git diff --cached --quiet; then
            echo "No changes to save"
            exit 0
          fi
          git commit -m "market farm: ${{ steps.session.outputs.value }} $(date -u +%F)"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
          done
          exit 1
