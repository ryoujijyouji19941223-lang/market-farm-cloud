name: Recent News Time Machine

on:
  schedule:
    # Sunday 10:17 JST (01:17 UTC)
    - cron: '17 1 * * 0'
  push:
    branches: [main]
    paths:
      - 'market_farm/recent_news_backtest.py'
      - 'market_farm/dashboard.py'
      - 'market_farm/news.py'
      - 'market_farm/data_source.py'
      - 'config.json'
      - '.github/workflows/recent-news.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-farm-recent-news
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  recent-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run strict-cutoff recent news test
        run: python -m market_farm.recent_news_backtest
      - name: Save time-machine results
        shell: bash
        run: |
          git config user.name "market-farm-bot"
          git config user.email "market-farm-bot@users.noreply.github.com"
          git add data/recent_news_backtest.json docs/index.html
          if git diff --cached --quiet; then
            echo "No recent-news changes to save"
            exit 0
          fi
          git commit -m "market farm: refresh recent news time machine $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
