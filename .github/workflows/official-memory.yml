name: Official Memory Collector

on:
  schedule:
    # 07:22 and 19:22 JST. Independent from the newspaper run.
    - cron: '22 22 * * *'
    - cron: '22 10 * * *'
  push:
    branches: [main]
    paths:
      - 'market_farm/official_archive.py'
      - 'market_farm/official_collectors.py'
      - 'market_farm/collectors_rss.py'
      - 'market_farm/collect_official.py'
      - '.github/workflows/official-memory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-farm-official-memory
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Test memory safety
        run: python -m pytest -q tests/test_point_in_time.py tests/test_world_memory.py tests/test_external_memory.py tests/test_expectations.py tests/test_market_experience.py tests/test_information_tiers.py tests/test_experience_pairs.py
      - name: Collect official evidence
        run: python -m market_farm.collect_official
      - name: Save official archive
        shell: bash
        run: |
          git config user.name "market-farm-bot"
          git config user.email "market-farm-bot@users.noreply.github.com"
          git add data/official_archive
          if git diff --cached --quiet; then
            echo "No official-memory changes"
            exit 0
          fi
          git commit -m "market farm: collect official evidence $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
