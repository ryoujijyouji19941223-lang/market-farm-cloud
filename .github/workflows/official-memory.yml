name: Official Memory Collector

on:
  schedule:
    # 07:22 and 19:22 JST. Independent from the newspaper run.
    - cron: '22 22 * * *'
    - cron: '22 10 * * *'
  push:
    branches: [main]
    paths:
      - 'market_farm/official_*.py'
      - 'market_farm/collectors_rss.py'
      - 'market_farm/collect_official.py'
      - 'market_farm/backfill_spf.py'
      - 'market_farm/backfill_livingston.py'
      - 'market_farm/backfill_actuals.py'
      - 'market_farm/rtds_*.py'
      - 'market_farm/reaction_*.py'
      - 'market_farm/backfill_reactions.py'
      - 'market_farm/build_market_experiences.py'
      - 'market_farm/expectation_*.py'
      - '.github/workflows/official-memory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-farm-official-memory
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest

      - name: Test memory safety
        run: >
          python -m pytest -q
          tests/test_point_in_time.py
          tests/test_world_memory.py
          tests/test_external_memory.py
          tests/test_expectations.py
          tests/test_market_experience.py
          tests/test_information_tiers.py
          tests/test_experience_pairs.py

      - name: Collect current official evidence
        run: python -m market_farm.collect_official

      - name: Backfill historical expectations
        run: |
          python -m market_farm.backfill_spf
          python -m market_farm.backfill_livingston

      - name: Backfill first-release actuals
        run: python -m market_farm.backfill_actuals

      - name: Measure post-release market reactions
        run: python -m market_farm.backfill_reactions

      - name: Build market experience cards
        run: python -m market_farm.build_market_experiences

      - name: Save market memory
        shell: bash
        run: |
          git config user.name "market-farm-bot"
          git config user.email "market-farm-bot@users.noreply.github.com"
          git add data/official_archive data/expectations data/actual_releases data/market_experience
          if git diff --cached --quiet; then
            echo "No market-memory changes"
            exit 0
          fi
          git commit -m "market farm: update official and historical memory $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
