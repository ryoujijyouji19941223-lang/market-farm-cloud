name: Three-month replay pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pilot-replay.yml'

permissions:
  contents: write

jobs:
  replay-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m market_farm.pilot_replay
      - name: Save pilot results
        run: |
          git config user.name "market-farm-bot"
          git config user.email "market-farm-bot@users.noreply.github.com"
          git add data/replay data/pilot_3month.json data/research_report.json docs/research.html
          git diff --cached --quiet && exit 0
          git commit -m "Run three-month historical replay pilot"
          git push
