name: Historical Backtest

on:
  schedule:
    # Sunday 09:37 JST (00:37 UTC)
    - cron: '37 0 * * 0'
  push:
    branches: [main]
    paths:
      - 'market_farm/backtest.py'
      - 'market_farm/dashboard.py'
      - 'market_farm/sensors.py'
      - 'market_farm/data_source.py'
      - 'config.json'
      - '.github/workflows/backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-farm-backtest
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run five-year walk-forward test
        run: python -m market_farm.backtest
      - name: Save historical results
        shell: bash
        run: |
          git config user.name "market-farm-bot"
          git config user.email "market-farm-bot@users.noreply.github.com"
          git add data/backtest.json docs/index.html
          if git diff --cached --quiet; then
            echo "No historical changes to save"
            exit 0
          fi
          git commit -m "market farm: refresh historical backtest $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
