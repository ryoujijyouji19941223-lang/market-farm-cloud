name: Refresh latest dashboard

on:
  workflow_run:
    workflows: ["Market Farm", "Historical Backtest", "Recent News Time Machine", "Historical Replay Backfill", "Historical Market Memory"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'market_farm/refresh_dashboard.py'
      - '.github/workflows/refresh-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-farm-refresh-dashboard
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild latest dashboard and research report
        run: python -m market_farm.refresh_dashboard
      - name: Persist current views
        shell: bash
        run: |
          git config user.name "market-farm-bot"
          git config user.email "market-farm-bot@users.noreply.github.com"
          git add docs/index.html docs/research.html data/research_report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "market farm: refresh views from latest persisted data"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            # A data producer may have finished while this job was rendering.
            # Render again after rebasing so views use that newer saved data.
            python -m market_farm.refresh_dashboard
            git add docs/index.html docs/research.html data/research_report.json
            git commit --amend --no-edit
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
