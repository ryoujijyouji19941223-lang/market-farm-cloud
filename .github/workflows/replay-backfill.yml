name: Historical Replay Backfill

on:
  schedule:
    # 10:47 JST every day. One historical month is added per run.
    - cron: '47 1 * * *'
  push:
    branches: [main]
    paths:
      - 'market_farm/replay_backfill.py'
      - 'market_farm/recent_news_backtest.py'
      - 'market_farm/backtest.py'
      - 'market_farm/data_source.py'
      - 'market_farm/news.py'
      - 'market_farm/sensors.py'
      - 'config.json'
      - '.github/workflows/replay-backfill.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-farm-replay-backfill
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Replay one historical month
        run: python -m market_farm.replay_backfill
      - name: Save replay archive
        shell: bash
        run: |
          git config user.name "market-farm-bot"
          git config user.email "market-farm-bot@users.noreply.github.com"
          git add data/replay data/replay_progress.json data/replay_index.json
          if git diff --cached --quiet; then
            echo "No replay changes to save"
            exit 0
          fi
          git commit -m "market farm: add historical replay month $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
